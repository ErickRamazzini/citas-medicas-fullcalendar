services:
  mysql:
    image: mysql:8.4
    container_name: citas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: citas_medicas
      MYSQL_USER: citas_user
      MYSQL_PASSWORD: citas_pass
      TZ: America/Guatemala
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: